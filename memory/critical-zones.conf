# critical-zones.conf — the zones tools/mutation-sweep.sh sweeps (non-blocking).
#
# These are the load-bearing modules whose silent failure would be worst: the
# acceptance-gate machinery itself. A mutation surviving here means a gate could
# be subverted without any test noticing. We ratchet coverage up one zone per
# iteration; the sweep report shows where to spend the next one.
#
# Format (one zone per line; '#' comments and blank lines ignored):
#   label | source-file [source-file...] | test-path
# whitespace around '|' is trimmed; test-path may be empty where the tool's
# per-repo config owns the test command.
#
# NB: mutmut 3.x runs PYTEST, so a zone is "wired" only once its source has an
# in-process pytest suite (importing the module so mutmut's sandbox exercises the
# mutant). The shell harnesses under tools/tests/<zone>/ drive the modules via
# subprocess and CANNOT serve as mutmut killers. We ratchet up one zone per
# iteration: acceptance-gate is wired (tests/test_acceptance_gate.py, 77.6%
# mutation score on 2026-06-23 — residual = argparse help-text + subprocess-kwarg
# equivalents, see that suite). manifest-gate and semantic-layer await their own
# pytest suites (next iterations); leaving them active would point mutmut at shell
# tests it can't collect and report FALSE survivors, so they stay commented out.
acceptance-gate | tools/acceptance_gate.py | tests/test_acceptance_gate.py
# manifest-gate   | tools/manifest_gate.py   | tests/test_manifest_gate.py    # PENDING pytest suite
# semantic-layer  | tools/semantic_layer.py  | tests/test_semantic_layer.py   # PENDING pytest suite
