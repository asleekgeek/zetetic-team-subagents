# semantic-layer.schema.yaml — CONTRACT for memory/semantic-layer.yaml
#
# The semantic layer is a query-indexed, human+AI-readable table of contents
# over Cortex memory. One entry per query/topic. Full content lives in Cortex
# (referenced by cortex_id); this file stays small and skimmable.
#
# Enforcement: tools/semantic_layer.py validates every entry against the rules
# documented here. This file is the human-readable spec; the Python module is
# the executable check. Keep them in sync.
#
# Source of the pattern: firecrawl-mcp-server search-feedback loop
# (rating + valuableSources + missingContent + querySuggestions). See
# docs derived in the reverse-engineering notes.
#
# Zetetic source discipline (coding-standards §8): every `fact` MUST carry a
# `source`. Unsourced claims are rejected by the validator — no source, not stored.

version: 1   # schema/file version (integer). Bump on breaking field changes.

# `entries` is a list of records. Each record's contract:
entry_contract:
  required:
    query:      "string — the natural-language question/topic. The human-readable key."
    query_id:   "string — stable kebab-case slug. The machine key (unique within the file)."
    intent:     "enum — ingest | verify | compare | monitor"
    domain:     "string — coarse topic bucket (e.g. mcp-architecture, retrieval, billing)."
    status:     "enum — fresh | stale | superseded"
    summary:    "string — 1-3 lines a human reads first: what we know."
    facts:      "list — the meaningful semantic units. Each: {claim, source, [confidence], [cortex_id]}."

  optional:
    aliases:    "list[string] — alternate query framings, for fuzzy recall matching."
    confidence: "enum — high | medium | low (overall, derived from facts)."
    created:    "date YYYY-MM-DD — set on first write."
    updated:    "date YYYY-MM-DD — set on every write."
    sources:    "list — provenance of ingested material. Each: {ref, kind, [accessed], [valuable]}."
    gaps:       "list — the LEARN signal (firecrawl missingContent). Each: {topic, [description], status}."
    outcome:    "map — feedback record: {rating, [valuable_sources], [query_suggestions]}."
    pointers:   "map — where to get full info: {cortex_memories[], files[], notebook}."
    freshness:  "map — monitor equivalent: {ttl_days, revalidate_after (date), watch (bool)}."

  field_enums:
    intent:        [ingest, verify, compare, monitor]
    status:        [fresh, stale, superseded]
    confidence:    [high, medium, low]
    outcome.rating: [good, partial, bad]
    gaps[].status: [open, researching, closed]
    sources[].kind: [code, web, paper, github, docs, dataset, internal]

  fact_contract:
    required:
      claim:  "string — one verifiable assertion."
      source: "string — citation (file:line, URL, paperId, benchmark path). REQUIRED (§8)."
    optional:
      confidence: "enum — high | medium | low."
      cortex_id:  "string — pointer to the full Cortex memory holding this fact."

# --- canonical example entry (also serves as the validator's golden fixture) ---
entries:
  - query: "How does firecrawl-mcp-server implement its search feedback loop?"
    query_id: firecrawl-search-feedback-loop
    aliases:
      - "firecrawl missingContent feedback"
      - "MCP search quality feedback endpoint"
    intent: ingest
    domain: mcp-architecture
    created: 2026-06-22
    updated: 2026-06-22
    status: fresh
    confidence: high
    summary: >
      Feedback is a POST to /v2/search/{id}/feedback carrying rating +
      valuableSources + missingContent + querySuggestions. Refunds 1 credit,
      rejects zero-effort feedback, 2-min window, terminal on 4xx.
    facts:
      - claim: "missingContent is an array of {topic, description} the agent expected but did not find."
        confidence: high
        source: "firecrawl-mcp-server src/index.ts:1143-1159"
        cortex_id: null
      - claim: "First feedback per searchId refunds 1 credit; search costs 2."
        confidence: high
        source: "firecrawl-mcp-server src/index.ts:1069"
        cortex_id: null
    sources:
      - ref: "github.com/firecrawl/firecrawl-mcp-server@main src/index.ts"
        kind: code
        accessed: 2026-06-22
        valuable: true
    gaps:
      - topic: "server-side aggregation of feedback into index priorities"
        description: "Not visible in client code; lives in Firecrawl cloud."
        status: open
    outcome:
      rating: good
      valuable_sources: ["src/index.ts"]
      query_suggestions: "Next time also grep server.json + CHANGELOG for endpoint contracts."
    pointers:
      cortex_memories: []
      files: ["/tmp/firecrawl-reverse-engineering/01-how-firecrawl-mcp-works.md"]
      notebook: null
    freshness:
      ttl_days: 90
      revalidate_after: 2026-09-20
      watch: false
