# CMA environment: pilot
#
# VERIFIED (Phase B, 2026-07-16): this manifest was validated against the
# live Managed Agents API — deploy.py created it as
# env_01EDqGQaZ6NeQV8X8VakKnUn (CreateEnvironment is not subject to the
# credit-balance gate that blocked the agent creates on the same run; see
# issue #26, Phase B run comment).
#
# Field sources: SDK anthropic 0.116 environment_create_params.py
# (name, description, metadata, scope, config) and
# platform.claude.com/docs/en/api/beta (environments).
#
# The five blocks that used to live here as ASSUMED (memory_store, vaults,
# resources, scheduled_deployments, limits) were REMOVED after verification
# against the SDK and the API reference: those concepts are first-class
# workspace objects attached to DEPLOYMENTS (or sessions), not environment
# fields, and `limits` has no API equivalent at all. See
# pilot.engagement.yaml (memory store + vault declarations) and
# *.deployment.yaml (per-facilitator deployment configs), and the mapping
# comment on issue #26.
#
# Note: the live `pilot` environment was created with this file's previous
# description text. Environments are not versioned; deploy.py deliberately
# leaves an existing environment untouched (create-once), so the live
# description predates this cleanup. Cosmetic only.

name: pilot
description: >-
  Shared environment for the 4 CMA facilitator agents (reporting, analysis,
  agent-management, security-data-audit) on a single pilot engagement.
  Each session gets its own fresh isolated container; engagement state
  lives in the memory store declared in pilot.engagement.yaml and is
  attached per deployment, not here.

# source: SDK environment_create_params.py config.type cloud | self_hosted;
# cloud networking defaults to unrestricted when omitted.
config:
  type: cloud
